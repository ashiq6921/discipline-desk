# Publishes the Discipline Desk web app to GitHub Pages and refreshes the news calendar every hour.
# Generated from the private trading-tool repo (scripts/site/site.yml). Edit it there, not here.
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *" # every hour, to refresh the news calendar
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Official GitHub actions, pinned to the exact commit of a release more than two weeks old.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Refresh the news calendar
        run: |
          mkdir -p public/data
          if python3 scripts/fetch_calendar.py public/data/calendar.json; then
            echo "calendar refreshed"
          else
            echo "download failed, trying to keep the copy that is already live"
            curl -sS --fail --max-time 30 "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/calendar.json" -o public/data/calendar.json || rm -f public/data/calendar.json
          fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
